}

/* =========================================================
   HHR MOVEMENT TRACKING
   ---------------------------------------------------------
   The GPS point taken at each household, in the order they were
   registered, numbered 1 to 25 and joined by lines. Drawn with
   Leaflet on OpenStreetMap tiles, so this screen needs internet;
   the ordered list below the map works without it.
   ========================================================= */
const LEAFLET_CSS='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
const LEAFLET_JS ='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
let trackDay=0, lmap=null, lloading=false;

/* the points of one day, in registration order, GPS only */
/* A registered household is drawn at the point taken when it was registered; a
   household still waiting for a revisit is drawn at the point taken on the visit
   where nobody was home. Registering it later turns that marker from yellow to
   green on its own, because the record stops being a revisit. */
function trackPoints(d){
  const out=[];
  for(let h=1;h<=PER_DAY;h++){
    const r=recGet(d,h);
    if(!r) continue;
    if(isRevisit(r)){
      if(r.revisitLat!==''&&r.revisitLat!=null)
        out.push({h:h,lat:+r.revisitLat,lng:+r.revisitLng,acc:r.revisitAcc,r:r,rev:true});
    } else if(r.gpsLat!==''&&r.gpsLat!=null){
      out.push({h:h,lat:+r.gpsLat,lng:+r.gpsLng,acc:r.gpsAcc,r:r,rev:false});
    }
  }
  return out;
}
function gpsDays(){ const o=[]; for(let d=1;d<=DAYS;d++) if(trackPoints(d).length) o.push(d); return o; }
/* metres between two points, straight line */
function metres(a,b){
  const R=6371000, t=Math.PI/180;
  const dLat=(b.lat-a.lat)*t, dLng=(b.lng-a.lng)*t;
  const la=a.lat*t, lb=b.lat*t;
  const x=Math.sin(dLat/2)**2+Math.cos(la)*Math.cos(lb)*Math.sin(dLng/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(x)));
}
/* Households registered within this many metres of each other cannot be told
   apart on the map, so they share one marker labelled with all their numbers
   (2,3,4) instead of stacking and hiding each other. */
const CLUSTER_M=20;
function clusterPoints(pts,thresh){
  const t=thresh||CLUSTER_M, groups=[];
  pts.forEach(p=>{
    let g=null;
    for(let i=0;i<groups.length;i++){ if(metres(groups[i],p)<=t){ g=groups[i]; break; } }
    if(g){
      g.items.push(p);
      g.lat=g.items.reduce((s,x)=>s+x.lat,0)/g.items.length;   /* centre of the group */
      g.lng=g.items.reduce((s,x)=>s+x.lng,0)/g.items.length;
    } else {
      groups.push({lat:p.lat,lng:p.lng,items:[p]});
    }
  });
  groups.forEach(g=>{
    g.hs=g.items.map(x=>x.h).sort((a,b)=>a-b);
    g.label=g.hs.length<=6?g.hs.join(','):g.hs.slice(0,5).join(',')+' +'+(g.hs.length-5);
  });
  return groups;
}
/* which group each household ended up in */
function groupOf(groups,h){ return groups.find(g=>g.hs.indexOf(h)>-1)||null; }
/* the route: group centres in visit order, without repeating a point you are
   already standing on */
function routeLine(pts,groups){
  const out=[];
  pts.forEach(p=>{
    const g=groupOf(groups,p.h); if(!g) return;
    const last=out[out.length-1];
    if(!last||last[0]!==g.lat||last[1]!==g.lng) out.push([g.lat,g.lng]);
  });
  return out;
}
function pathLength(pts){ let m=0; for(let i=1;i<pts.length;i++) m+=metres(pts[i-1],pts[i]); return m; }
const asDist=m=>m<1000?m+' m':(m/1000).toFixed(1)+' km';
const hhmm=iso=>String(iso||'').slice(11,16);

function renderTrack(d){
  const days=gpsDays();
  if(!d) d = days.indexOf(trackDay)>-1 ? trackDay : (days.length?days[days.length-1]:1);
  trackDay=d;
  const pts=trackPoints(d);
  const groups=clusterPoints(pts);
  const shared=groups.filter(g=>g.hs.length>1);
  const chips=[];
  for(let x=1;x<=DAYS;x++){
    const has=trackPoints(x).length;
    chips.push(`<button class="${x===d?'on':''}" ${has?`onclick="renderTrack(${x})"`:'disabled'}>Day ${x}${has?' \u00b7 '+has:''}</button>`);
  }
  let steps='';
  pts.forEach((p,i)=>{
    const gap=i?metres(pts[i-1],p):0;
    const g=groupOf(groups,p.h);
    const with_=g&&g.hs.length>1?g.hs.filter(x=>x!==p.h):[];
    const who = p.rev ? 'Revisit \u00b7 nobody available'
                      : esc((p.r.first||'')+' '+(p.r.last||''))+' \u00b7 '+esc(p.r.token||'');
    steps+=`<div class="step-row">
      <span class="sn ${p.rev?'rev':'reg'}${i===0?' start':''}">${p.h}</span>
      <span class="sm"><span class="t">${who}</span>
        <span class="s">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}${p.acc?' (\u00b1'+p.acc+' m)':''}${hhmm(p.r.gpsAt)?' \u00b7 '+hhmm(p.r.gpsAt):''}${with_.length?' \u00b7 same point as '+with_.join(', '):''}</span></span>
      <span class="sg">${i?'+'+asDist(gap):'start'}</span></div>`;
  });
  app.innerHTML=`<div class="appbar">
      <button class="ico-btn" onclick="renderMenu()">${I.back}</button>
      <div class="titles"><div class="eyebrow">${esc(me)} \u00b7 movement tracking</div><div class="title">Day ${d} route</div></div>
      <span class="tag-pill me">${pts.length}/${PER_DAY}</span>
    </div>
    <div class="body"><div class="list">
      <div class="daybar">${chips.join('')}</div>
      ${pts.length?`<div class="stat-grid">
          <div class="stat"><div class="n">${pts.length}</div><div class="l">Households mapped on Day ${d}${pts.filter(p=>p.rev).length?' ('+pts.filter(p=>p.rev).length+' revisit)':''}</div></div>
          <div class="stat"><div class="n g">${asDist(pathLength(pts))}</div><div class="l">Distance along the route</div></div>
        </div>
        ${shared.length?`<div class="sync-bar wait"><span class="d"></span>
          <div class="t">${shared.length} point${shared.length===1?'':'s'} hold more than one household \u2014 within ${CLUSTER_M} m the GPS cannot separate them, so they share one marker: ${esc(shared.map(g=>g.label).join(' \u00b7 '))}.</div></div>`:''}`:''}
      <div id="map"></div>
      <div id="mapmsg"></div>
      ${pts.length?`<div class="legend" style="margin:11px 2px 0">
        <span><i class="mg"></i>Registered</span><span><i class="my"></i>Waiting for a revisit</span>
        <span><i class="s"></i>First household of the day</span></div>`:''}
      ${pts.length?`<div class="sub" style="margin:15px 0 8px"><b>Household 1 to ${pts[pts.length-1].h}</b>, in the order you registered them.${hhmm(pts[0].r.gpsAt)?' Started '+hhmm(pts[0].r.gpsAt)+', finished '+hhmm(pts[pts.length-1].r.gpsAt)+'.':''}</div>
        <div class="card steps">${steps}</div>`
        :`<div class="sync-bar wait" style="margin-top:13px"><span class="d"></span>
           <div class="t">No GPS points for Day ${d} yet. A point is taken at each household as it is registered.</div></div>`}
    </div></div>`;
  if(pts.length) drawMap(pts); else document.getElementById('map').style.display='none';
}

/* Leaflet is pulled in on first use so the rest of the app does not wait on it. */
function withLeaflet(cb){
  if(window.L){ cb(true); return; }
  if(lloading){ setTimeout(()=>withLeaflet(cb),300); return; }
  lloading=true;
  const css=document.createElement('link');
  css.rel='stylesheet'; css.href=LEAFLET_CSS; document.head.appendChild(css);
  const js=document.createElement('script');
  js.src=LEAFLET_JS;
  js.onload=()=>{ lloading=false; cb(!!window.L); };
  js.onerror=()=>{ lloading=false; cb(false); };
  document.head.appendChild(js);
  setTimeout(()=>{ if(lloading){ lloading=false; cb(!!window.L); } },15000);
}
function mapMsg(html){ const e=document.getElementById('mapmsg'); if(e) e.innerHTML=html; }
function drawMap(pts){
  const host=document.getElementById('map');
  if(!host) return;
  host.innerHTML=`<div style="height:100%;display:grid;place-items:center"><div class="spin"></div></div>`;
  withLeaflet(ok=>{
    const h=document.getElementById('map');
    if(!h) return;
    if(!ok||!window.L){
      h.style.display='none';
      mapMsg(`<div class="sync-bar warn"><span class="d"></span>
        <div class="t"><b>Map needs internet.</b> The route is listed below with its coordinates.</div>
        <button class="btn btn-ghost btn-sm" style="flex:0 0 auto" onclick="renderTrack(${trackDay})">Retry</button></div>`);
      return;
    }
    mapMsg('');
    h.innerHTML='';
    if(lmap){ try{ lmap.remove(); }catch(e){} lmap=null; }
    const groups=clusterPoints(pts);
    const line=routeLine(pts,groups);
    lmap=L.map(h,{zoomControl:true,attributionControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:19, attribution:'\u00a9 OpenStreetMap contributors'}).addTo(lmap);
    if(line.length>1){
      L.polyline(line,{color:'#c84c0e',weight:3.5,opacity:.9}).addTo(lmap);
      L.polyline(line,{color:'#ffffff',weight:1,opacity:.7,dashArray:'4 7'}).addTo(lmap);
    }
    const firstH=pts[0].h;
    groups.forEach(g=>{
      const anyRev=g.items.some(p=>p.rev);
      const k=(anyRev?'rev':'reg')+(g.hs.indexOf(firstH)>-1?' start':'');
      const multi = g.hs.length>1;
      const w = multi ? 12+g.label.length*7 : 26;
      const body = g.items.map(p=>p.rev
        ? `<b>Household ${p.h}</b><br><span style="color:#9e5f00">Revisit \u2014 nobody was available</span><br>
           Point taken ${hhmm(p.r.revisitAt)||''}`
        : `<b>Household ${p.h}</b><br>${esc((p.r.first||'')+' '+(p.r.last||''))}<br>
           ${esc(p.r.token||'')}<br>${p.r.size||''} people \u00b7 ${p.r.itns||''} ITN${p.r.itns===1?'':'s'}${hhmm(p.r.gpsAt)?' \u00b7 '+hhmm(p.r.gpsAt):''}${p.r._wasRevisit==='Yes'?'<br><span style="color:#9e5f00">was a revisit</span>':''}`
      ).join('<hr style="border:none;border-top:1px solid #d6d5d4;margin:7px 0">');
      L.marker([g.lat,g.lng],{icon:L.divIcon({className:'',
          html:`<div class="mk ${k} ${multi?'multi':''}">${esc(g.label)}</div>`,
          iconSize:[w,26],iconAnchor:[w/2,13]}),zIndexOffset:multi?1000:0}).addTo(lmap)
        .bindPopup(`<div class="mpop">${multi?`<div style="font:600 11px var(--body);color:#787878;margin-bottom:6px">${g.hs.length} households at this point</div>`:''}${body}</div>`);
    });
    if(line.length>1) lmap.fitBounds(L.latLngBounds(line).pad(0.18));
    else lmap.setView(line[0],17);
    setTimeout(()=>{ try{ lmap.invalidateSize(); }catch(e){} },200);
  });
}


/* =========================================================
   25 HOUSEHOLD CARDS FOR ONE DAY
   ========================================================= */
function renderDay(d){
  gpsStop();
  if(!dayOpen(d)){ renderDays(); return; }
  const nx=nextHH(d);
  let tiles='';
  for(let h=1;h<=PER_DAY;h++){
    const ok=isDone(d,h), open=hhOpen(d,h);
    const rec=recGet(d,h), pend=ok&&needsSend(rec), rev=isRevisit(rec);
    const cls = rev?'revisit' : ok?'done' : open?(h===nx?'todo next':'todo') : 'locked todo';
    const state = rev?'Revisit' : ok?(pend?'To send':'Sent') : open?(h===nx?'Next':'To do') : I.lock;
    tiles+=`<button class="tile hh ${cls}" ${open?`onclick="openHH(${d},${h})"`:`onclick="toast('Household ${h-1} has to be registered first.')"`}>
      ${pend?'<span class="pend"></span>':''}
      <span class="hn">${h}</span><span class="hs">${state}</span></button>`;
  }
  const n=dayCount(d);
  app.innerHTML=`<div class="appbar">
      <button class="ico-btn" onclick="renderDays()">${I.back}</button>
      <div class="titles"><div class="eyebrow">${esc(me)} · Day ${d} of ${DAYS}</div><div class="title">25 households</div></div>
      <span class="tag-pill me">${n}/${PER_DAY}</span>
    </div>
    <div class="body"><div class="list">
      <h2>Day ${d}</h2>
      <div class="sub">${n} of ${PER_DAY} visited${revisitCount(d)?', '+revisitCount(d)+' waiting for a revisit':''}.${nx?' Household '+nx+' is next — they open one at a time, in order.':' Day '+d+' is complete'+(d<DAYS?', Day '+(d+1)+' is now open.':'.')}</div>
      ${daySubmitBar(d)}
      <div class="legend"><span><i class="d"></i>Registered</span><span><i class="r"></i>Revisit</span><span><i class="t"></i>Not registered</span><span><i class="l"></i>Locked</span></div>
      <div class="grid g4">${tiles}</div>
    </div></div>`;
}

/* The day's records are submitted as a batch, once the day is finished. */
function daySubmitBar(d){
  if(!dayComplete(d)) return `<div class="sync-bar wait"><span class="d"></span>
    <div class="t">Records are submitted once all ${PER_DAY} households of the day are registered.</div></div>`;
  const out=dayToSend(d), changed=dayRecs(d).filter(r=>r._submitted&&r._dirty).length;
  if(!out.length) return `<div class="sync-bar ok"><span class="d"></span>
    <div class="t"><b>Day ${d} submitted.</b> All ${PER_DAY} records are submitted.</div></div>`;
  const label = changed===out.length
    ? 'Resubmit '+changed+' changed record'+(changed===1?'':'s')
    : 'Submit Day '+d+' \u00b7 '+out.length+' record'+(out.length===1?'':'s');
  return `<div class="sync-bar warn"><span class="d"></span>
    <div class="t"><b>${out.length} record${out.length===1?'':'s'} not submitted.</b>${changed?'<br>'+changed+' of them changed since the last submission.':''}</div>
    <button class="btn btn-primary btn-sm" style="flex:0 0 auto" onclick="submitDay(${d})">${changed===out.length?'Resubmit':'Submit'}</button></div>`;
}
/* Sends one record at a time and reports what got through. A record that fails
   keeps its unsent flag, so pressing Submit again picks up only what is left. */
function submitDay(d){
  if(!GAS_URL){ setGAS(); return; }
  const q=dayToSend(d);
  if(!q.length){ toast('Day '+d+' is already submitted'); return; }
  if(!navigator.onLine){ modal(`<h3>No internet</h3>
    <p>Day ${d} has ${q.length} record${q.length===1?'':'s'} to submit. They are safe on this device \u2014 connect and submit again.</p>
    <div class="acts"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>`); return; }
  let i=0, sent=0, failed=0;
  const draw=()=>modal(`<h3>Submitting Day ${d}</h3><div class="spin"></div>
    <p style="text-align:center">Record ${Math.min(i+1,q.length)} of ${q.length}</p>`);
  draw();
  const step=()=>{
    if(i>=q.length){ saveRecs(); doneSubmit(d,sent,failed); return; }
    const rec=q[i]; draw();
    sendRec(rec,(ok,status)=>{
      if(ok){ rec._submitted=true; rec._dirty=false; rec._submittedAt=new Date().toISOString(); sent++; }
      else { rec._lastError=status||'failed'; failed++; }
      saveRecs(); i++; setTimeout(step,250);
    });
  };
  step();
}
function doneSubmit(d,sent,failed){
  const left=dayToSend(d).length;
  modal(`<h3>${failed?'Partly submitted':'Day '+d+' submitted'}</h3>
    <p>${sent} record${sent===1?'':'s'} submitted.${failed?' '+failed+' could not be sent and are still on this device.':''}</p>
    ${failed?`<div class="err">Day ${d} has ${left} record${left===1?'':'s'} left to submit.</div>`
            :`<div class="gps-ok">Nothing left to send for Day ${d}.</div>`}
    <div class="acts">
      <button class="btn btn-ghost" onclick="closeModal();renderDay(${d})">Day ${d}</button>
      ${failed?`<button class="btn btn-primary" onclick="closeModal();submitDay(${d})">Try the rest</button>`
              :`<button class="btn btn-ok" onclick="closeModal();renderDays()">Back to the days</button>`}
    </div>`);
}


/* =========================================================
   REVISIT — coming back to a household nobody was home at
   ---------------------------------------------------------
   The registrar has to be standing at the household to open it: a fresh
   fix must be within REVISIT_M of the point taken on the first visit.
   ========================================================= */
const REVISIT_M=50;
function renderRevisitCard(){
  const d=formD,h=formH,r=recGet(d,h)||{};
  app.innerHTML=`<div class="appbar">
      <button class="ico-btn" onclick="renderDay(${d})">${I.back}</button>
      <div class="titles"><div class="eyebrow">${esc(me)} \u00b7 Day ${d}</div><div class="title">Household ${h} \u00b7 revisit</div></div>
      <span class="tag-pill me">${hhSerial(d,h)}/${DAYS*PER_DAY}</span>
    </div>
    <div class="body"><div class="list">
      <div class="hd-head" style="border-left-color:#ea8d00;background:#fff3e0">
        <div class="id">Revisit</div>
        <div class="meta">Nobody was available on ${esc(String(r._ts||'').slice(0,10))}.<br>
          Point taken: ${esc(r.revisitLat)}, ${esc(r.revisitLng)} (\u00b1${esc(r.revisitAcc)} m)</div></div>
      ${r._submitted?`<div class="sync-bar ok"><span class="d"></span><div class="t"><b>The revisit is submitted.</b></div></div>`
        :`<div class="sync-bar warn"><span class="d"></span><div class="t"><b>Saved on this device.</b><br>It is submitted on its own as soon as there is internet.</div></div>`}
      <div class="note">To register this household you must be at it. Tap below while you are standing there \u2014 your position is checked against the point taken on the first visit, and must be within ${REVISIT_M} m.</div>
      <div id="gate"></div>
    </div></div>
    <div class="footer">
      <button class="btn btn-ghost btn-sm" onclick="renderDay(${d})">Day ${d}</button>
      <button class="btn btn-ok" onclick="revisitGate()">I am at the household</button>
    </div>`;
}
/* The tap that starts this is also the user gesture the browser wants before
   it will raise a permission box. */
function revisitGate(){
  const d=formD,h=formH,r=recGet(d,h)||{};
  modal(`<h3>Checking you are at the household</h3><div class="spin"></div>
    <p style="text-align:center">Taking your position\u2026</p>`);
  gpsFix=null; gpsState='idle';
  beginGps();
  const t0=Date.now();
  const tick=()=>{
    if(gpsState==='ok'&&gpsFix){ gateResult(gpsFix,r); return; }
    if(gpsState==='fail'){
      modal(`<h3>No GPS point yet</h3><p>${esc(gpsErr)} ${esc(gpsHint.replace(/<[^>]+>/g,''))}</p>
        <div class="acts">
          <button class="btn btn-ghost" onclick="closeModal()">Close</button>
          <button class="btn btn-primary" onclick="revisitGate()">Try again</button>
        </div>`);
      return;
    }
    if(Date.now()-t0>45000){
      modal(`<h3>Still no position</h3><p>The check needs a GPS point. Step into the open and try again.</p>
        <div class="acts"><button class="btn btn-ghost" onclick="closeModal()">Close</button>
        <button class="btn btn-primary" onclick="revisitGate()">Try again</button></div>`);
      return;
    }
    setTimeout(tick,300);
  };
  setTimeout(tick,200);
}
function gateResult(fix,r){
  const away=metres({lat:Number(r.revisitLat),lng:Number(r.revisitLng)},{lat:fix.lat,lng:fix.lng});
  if(away>REVISIT_M){
    modal(`<h3>You are not at the household</h3>
      <p>You are about <b>${asDist(away)}</b> from the point taken on the first visit. Go to where you took that GPS point before, then take it again.</p>
      <div class="err">Household ${formH} cannot be opened from here.</div>
      <div class="acts">
        <button class="btn btn-ghost" onclick="closeModal()">Close</button>
        <button class="btn btn-primary" onclick="revisitGate()">Take it again</button>
      </div>`);
    return;
  }
  closeModal();
  /* at the household: open the full form, keeping the first-visit point */
  showErr=false; editing=false;
  form={};
  renderForm();
  toast('You are '+asDist(away)+' from the first point \u2014 carry on');
}
/* =========================================================
   ONE HOUSEHOLD
   ========================================================= */
/* ---------- the registration form ---------- */
/* Q3 branches: a household with no phone gives an alternative contact; with no
   alternative either, the registrar's own number is recorded so the household
   can still be reached through them. */
const FORM=[
  {id:'adults', n:1, q:'Are adults available in the household to do the registration?', type:'yn',
     help:'If nobody is there, take the GPS point and mark the household for a revisit.'},
  {id:'first', n:2, q:'First name of household head', type:'text', ph:'First name', when:a=>a.adults==='Yes'},
  {id:'last',  n:3, q:'Last name of household head',  type:'text', ph:'Last name',  when:a=>a.adults==='Yes'},
  {id:'hasPhone', n:4, q:'Do you have a telephone number?', type:'yn', when:a=>a.adults==='Yes'},
  {id:'phone',       q:'Telephone number', type:'tel', ph:'076123456',
     when:a=>a.adults==='Yes'&&a.hasPhone==='Yes'},
  {id:'hasAlt',      q:'Do you have someone else\u2019s number you can give if we want to call you?', type:'yn',
     when:a=>a.adults==='Yes'&&a.hasPhone==='No'},
  {id:'altPhone',    q:'Telephone number of that person', type:'tel', ph:'076123456',
     when:a=>a.adults==='Yes'&&a.hasPhone==='No'&&a.hasAlt==='Yes'},
  {id:'size',  n:5, q:'Number of people in the household', type:'int', unit:'people', min:1, max:60,
     when:a=>a.adults==='Yes'},
  {id:'itns',  n:6, q:'ITNs to be given', type:'calc',
     help:'1 to 2 people = 1 ITN, 3 to 4 = 2 ITNs, 5 or more = 3 ITNs.',
     from:a=>itnsFor(a.size), when:a=>a.adults==='Yes'},
  {id:'u5',    n:7, q:'How many under-fives are in the household?', type:'int', unit:'under-fives', min:0, max:30,
     when:a=>a.adults==='Yes'},
  {id:'preg',  n:8, q:'How many pregnant women are in the household?', type:'int', unit:'pregnant women', min:0, max:20,
     when:a=>a.adults==='Yes'},
  {id:'hasNid', n:9, q:'Do you have a National ID?', type:'yn', when:a=>a.adults==='Yes'},
  {id:'nid',         q:'National ID number', type:'text', ph:'National ID number',
     when:a=>a.adults==='Yes'&&a.hasNid==='Yes'},
  {id:'hasDl', n:10, q:'Do you have a driver\u2019s licence?', type:'yn', when:a=>a.adults==='Yes'},
  {id:'dl',          q:'Driver\u2019s licence number', type:'text', ph:'Driver\u2019s licence number',
     when:a=>a.adults==='Yes'&&a.hasDl==='Yes'},
  {id:'hasVid', n:11, q:'Do you have a Voter\u2019s ID?', type:'yn', when:a=>a.adults==='Yes'},
  {id:'vid',         q:'Voter\u2019s ID number', type:'text', ph:'Voter\u2019s ID number',
     when:a=>a.adults==='Yes'&&a.hasVid==='Yes'},
  {id:'token', n:12, q:'Household token', type:'calc',
     help:'Generated from your HHR ID, the household number and the head\u2019s initials.',
     from:a=>a._token||'', when:a=>a.adults==='Yes'}
];
function itnsFor(size){
  const n=parseInt(size,10);
  if(!n||n<1) return '';
  if(n<=2) return 1;
  if(n<=4) return 2;
  return 3;
}
/* HHR01_1_MK — the household number runs across the whole 10 days for this
   HHR (Day 1 HH1 = 1 … Day 10 HH25 = 250) so no two tokens can collide. */
function hhSerial(d,h){ return (d-1)*PER_DAY+h; }
function tokenFor(id,d,h,first,last){
  const ini=(String(first||'').trim()[0]||'')+(String(last||'').trim()[0]||'');
  return id+'_'+hhSerial(d,h)+'_'+ini.toUpperCase();
}
const digits=v=>String(v||'').replace(/\D/g,'');
const PHONE_LEN=9;
function visibleQs(a){ return FORM.filter(q=>!q.when||q.when(a)); }
function fieldErr(q,a){
  if(q.type==='calc') return '';
  const v=a[q.id];
  if(v===undefined||v===null||String(v).trim()==='') return 'Required.';
  if(q.type==='tel'){
    const n=digits(v).length;
    if(n<PHONE_LEN) return 'A telephone number is exactly '+PHONE_LEN+' digits \u2014 this one has '+n+'.';
    if(n>PHONE_LEN) return 'A telephone number is exactly '+PHONE_LEN+' digits.';
  }
  if(q.type==='int'){
    const n=Number(v);
    if(!Number.isInteger(n)) return 'Whole numbers only.';
    if(q.min!=null&&n<q.min) return 'Cannot be less than '+q.min+'.';
    if(q.max!=null&&n>q.max) return 'Cannot be more than '+q.max+'.';
  }
  /* under-fives and pregnant women are both counted among the household, so
     together they cannot outnumber it */
  if((q.id==='u5'||q.id==='preg')&&a.size!==undefined&&String(a.size).trim()!==''){
    const u=Number(a.u5), p=Number(a.preg), size=Number(a.size);
    if(!isNaN(u)&&!isNaN(p)&&u+p>size)
      return 'Under-fives ('+u+') and pregnant women ('+p+') come to '+(u+p)+', more than the '+size+' people in the household.';
  }
  return '';
}

/* =========================================================
   ONE HOUSEHOLD
   ========================================================= */
let form={}, formD=0, formH=0, showErr=false, editing=false;
/* The GPS point is taken in the background from the moment the form opens, so
   by the time the token has been written and submission reaches the GPS step it
   is almost always already captured. It stays LAST in the flow — nothing is
   saved before it — but the wait moves off the end of the interview. */
let gpsFix=null, gpsState='idle', gpsErr='', gpsHint='', gpsNext=null;
let gpsWatch=null, gpsT0=0, gpsTick=null;
const GPS_GOOD=25;        /* metres: accurate enough to stop chasing a better one */
const GPS_BUDGET=60000;   /* keep trying to improve for this long, then settle */

/* Diagnostics for the field: whatever the browser actually told us, kept so a
   registrar can read it back over the phone instead of "it does not work". */
let gpsDiag='';
function gpsContext(){
  const secure=(window.isSecureContext!==false);
  return (location.protocol||'?')+(secure?' · secure':' · NOT secure');
}
/* Two things stop a fix before the signal is ever involved, and both look like
   bad GPS: a page that is not https, and a permission prompt the browser will
   not show without a tap. Neither is a reason to refuse to try — we attempt
   anyway and keep a button so the registrar can trigger it by hand. */
function gpsStop(){
  if(gpsWatch!=null&&navigator.geolocation&&navigator.geolocation.clearWatch){
    try{ navigator.geolocation.clearWatch(gpsWatch); }catch(e){}
  }
  gpsWatch=null;
  if(gpsTick){ clearInterval(gpsTick); gpsTick=null; }
}
function gpsSecs(){ return gpsT0?Math.round((Date.now()-gpsT0)/1000):0; }

/* Two attempts run together, because one alone is what makes this hard in the
   field: a quick coarse fix so there is something within a second or two, and
   a watch on the real GPS that keeps replacing it with a better one. The best
   reading wins. We stop as soon as it is accurate enough, or when the time
   budget runs out. */
function beginGps(){
  if(editing) return;
  gpsStop();
  if(!navigator.geolocation){
    gpsState='fail'; gpsErr='This browser has no location support.'; gpsHint='';
    gpsDiag='no navigator.geolocation · '+gpsContext(); paintGps(); return;
  }
  gpsFix=null; gpsState='getting'; gpsErr=''; gpsHint=''; gpsDiag=''; gpsT0=Date.now();
  paintGps();

  /* 1 — fast and rough: happy with a cached or network-derived position */
  try{
    navigator.geolocation.getCurrentPosition(
      p=>gpsTake(p),
      ()=>{},                                /* its failure is not fatal, the watch continues */
      {enableHighAccuracy:false, timeout:15000, maximumAge:120000});
  }catch(e){}

  /* 2 — the real thing, reporting repeatedly as the fix sharpens */
  try{
    gpsWatch=navigator.geolocation.watchPosition(
      p=>gpsTake(p),
      e=>gpsProblem(e),
      {enableHighAccuracy:true, timeout:45000, maximumAge:0});
  }catch(e){
    try{
      navigator.geolocation.getCurrentPosition(p=>gpsTake(p),e2=>gpsProblem(e2),
        {enableHighAccuracy:true, timeout:45000, maximumAge:0});
    }catch(e2){ gpsProblem({code:0,message:String(e2&&e2.message||e2)}); }
  }

  /* the card counts up while it searches, so a long wait looks like progress
     rather than a hang */
  gpsTick=setInterval(()=>{
    if(gpsState==='getting'||(gpsState==='ok'&&gpsWatch!=null)) paintGps();
    if(gpsT0&&Date.now()-gpsT0>GPS_BUDGET){
      if(gpsFix) gpsStop();
      else if(gpsState==='getting'){
        gpsState='fail';
        gpsErr='No location after '+Math.round(GPS_BUDGET/1000)+' seconds.';
        gpsHint='Tap <b>Take the GPS point</b> below. If a permission box appears, allow it. Then step into the open, away from walls and roofs.';
        gpsDiag='no response · '+gpsContext();
        gpsStop();
      }
      paintGps();
    }
  },1000);
}
function gpsTake(p){
  if(!p||!p.coords) return;
  const f={lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6),
           acc:Math.round(p.coords.accuracy||0), at:new Date().toISOString()};
  if(!gpsFix||f.acc<=gpsFix.acc) gpsFix=f;      /* keep the sharpest reading */
  gpsState='ok'; gpsErr=''; gpsHint=''; gpsDiag='';
  if(gpsFix.acc<=GPS_GOOD||Date.now()-gpsT0>GPS_BUDGET) gpsStop();
  paintGps();
}
function gpsProblem(e){
  if(gpsFix){ gpsStop(); return; }             /* already have a point — ignore */
  const code=e&&e.code;
  const insecure=(window.isSecureContext===false);
  gpsState='fail';
  if(code===1){
    gpsErr='The browser did not give permission.';
    gpsHint=insecure
      ? 'This page is not on https, and browsers refuse location there. Open the app from its https web address rather than a downloaded copy of the file.'
      : 'Tap <b>Take the GPS point</b> below and allow location when the box appears. If no box appears, allow it from the padlock or (i) beside the address, and check location is on in the phone settings.';
  } else if(code===2){
    gpsErr='The device cannot work out where it is.';
    gpsHint='Turn location on in the phone settings, step into the open, and tap <b>Take the GPS point</b>. Indoors it often fails.';
  } else {
    gpsErr='Location is taking too long.';
    gpsHint='Step into the open, away from walls and roofs, then tap <b>Take the GPS point</b>.';
  }
  gpsDiag='code '+(code==null?'?':code)+(e&&e.message?' · '+e.message:'')+' · '+gpsContext();
  gpsStop(); paintGps();
}
/* Always one tap away. Some browsers will not raise the permission box unless
   the request comes from a tap, so the automatic attempt on its own is not
   enough — this button is the gesture. */
function gpsButton(label,kind){
  return `<button class="btn ${kind||'btn-primary'} btn-block btn-sm" style="margin-top:9px" onclick="beginGps()">${label}</button>`;
}
let gpsMissing=false;   /* set when Register is pressed before the GPS is captured */
function gpsCard(){
  const secs=gpsSecs();
  const body =
    gpsState==='idle'
      ? `${gpsMissing?'<div class="err" style="margin:0 0 4px">Capture the GPS before registering this household.</div>':''}
         <button class="btn btn-primary btn-block" style="margin-top:6px" onclick="gpsMissing=false;beginGps()">
           <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
           Capture GPS</button>`
  : gpsState==='ok'
      ? `<div class="gps-ok">Captured \u00b7 ${gpsFix.lat}, ${gpsFix.lng} (\u00b1${gpsFix.acc} m)</div>
         ${gpsWatch!=null?`<div class="q-help" style="margin:8px 0 0">Still sharpening the point \u2014 you can carry on, the best reading is kept.</div>`:''}
         ${gpsFix.acc>GPS_GOOD&&gpsWatch==null?`<div class="q-help" style="margin:8px 0 0">\u00b1${gpsFix.acc} m is rough. Fine to submit, or take it again in the open for a tighter point.</div>
           ${gpsButton('Take the GPS point again','btn-ghost')}`:''}`
  : gpsState==='fail'
      ? `<div class="err">${esc(gpsErr)} A point is needed before this household can be registered.</div>
         ${gpsHint?`<div class="q-help" style="margin:8px 0 0">${gpsHint}</div>`:''}
         ${gpsButton('Take the GPS point')}
         ${gpsDiag?`<div class="gps-diag">${esc(gpsDiag)}</div>`:''}`
  :       `<div class="sync-bar wait" style="margin:0"><span class="d"></span>
            <div class="t">Capturing the location\u2026 ${secs}s. Stay where you are, in the open if you can.</div></div>
           ${secs>=8?gpsButton('Take the GPS point now','btn-ghost'):''}`;
  return `<div class="q-card ${gpsMissing&&gpsState==='idle'?'missing':''}" id="qc_gps">
    <span class="q-no">GPS</span>
    <div class="q-txt">Location of the household</div>
    <div class="q-help">Last step. Stand at the household and press Capture GPS.</div>
    ${body}</div>`;
}
function paintGps(){ const e=document.getElementById('qc_gps'); if(e) e.outerHTML=gpsCard(); }

function openHH(d,h){
  if(!hhOpen(d,h)){ renderDay(d); return; }
  formD=d; formH=h; showErr=false; editing=false;
  form=Object.assign({},recGet(d,h));
  if(isDone(d,h)){
    gpsStop(); gpsFix=null; gpsState='idle';
    isRevisit(recGet(d,h)) ? renderRevisitCard() : renderSaved();
    return;
  }
  renderForm();
  gpsStop(); gpsFix=null; gpsState='idle'; gpsMissing=false;   /* GPS waits for the Capture GPS button */
}
/* Editing changes the values of an existing record. Its token has already been
   written on paper and given to the household head, so the token is frozen
   from the first submission onwards even if a name is corrected. */
function editHH(){
  editing=true; showErr=false;
  form=Object.assign({},recGet(formD,formH));
  renderForm();
}
function refreshToken(){
  if(editing&&form.token){ form._token=form.token; return; }
  form._token=tokenFor(me,formD,formH,form.first,form.last);
}

function ctl(q){
  const v=form[q.id]==null?'':form[q.id];
  if(q.type==='yn'){
    return `<div class="opts">
      <div class="opt yes ${v==='Yes'?'sel':''}" data-q="${q.id}" data-v="Yes"><span class="mark"></span><span>Yes</span></div>
      <div class="opt no ${v==='No'?'sel':''}" data-q="${q.id}" data-v="No"><span class="mark"></span><span>No</span></div>
    </div>`;
  }
  if(q.type==='calc'){
    const val=q.from(form);
    return `<div class="field"><input type="text" readonly value="${esc(val===''?'\u2014':val)}"></div>`;
  }
  const t=q.type==='tel'?'tel':q.type==='int'?'number':'text';
  const attrs=[q.min!=null?`min="${q.min}"`:'',q.max!=null?`max="${q.max}"`:'',q.type==='int'?'step="1" inputmode="numeric"':'',
               q.type==='tel'?`inputmode="numeric" maxlength="${PHONE_LEN}"`:'',q.ph?`placeholder="${esc(q.ph)}"`:''].join(' ');
  const inp=`<input type="${t}" ${attrs} data-k="${q.id}" value="${esc(v)}">`;
  return q.unit?`<div class="field unit">${inp}<span class="u">${esc(q.unit)}</span></div>`:`<div class="field">${inp}</div>`;
}
function qCard(q){
  const e=showErr?fieldErr(q,form):'';
  return `<div class="q-card ${e?'missing':''}" id="qc_${q.id}">
    ${q.n?`<span class="q-no">Q${q.n}</span>`:''}
    <div class="q-txt">${esc(q.q)}${q.type==='calc'?'':'<span class="req">*</span>'}</div>
    ${q.help?`<div class="q-help">${esc(q.help)}</div>`:''}
    ${ctl(q)}
    ${e?`<div class="err">${esc(e)}</div>`:''}
  </div>`;
}
function renderForm(){
  refreshToken();
  const d=formD,h=formH;
  app.innerHTML=`<div class="appbar">
      <button class="ico-btn" onclick="renderDay(${d})">${I.back}</button>
      <div class="titles"><div class="eyebrow">${esc(me)} · Day ${d}</div><div class="title">Household ${h} of ${PER_DAY}</div></div>
      <span class="tag-pill me">${hhSerial(d,h)}/${DAYS*PER_DAY}</span>
    </div>
    <div class="body"><div class="list" id="fb">
      <div class="hd-head"><div class="id">${esc(editing?(form.token||''):me+' \u00b7 D'+d+' \u00b7 HH'+h)}</div>
        <div class="meta">Household ${h} on Day ${d} \u2014 number ${hhSerial(d,h)} of your ${DAYS*PER_DAY}.${editing?'<br>Correcting the answers on a record that is already registered.':''}</div></div>
      ${editing?`<div class="note">Change the answers that are wrong and save. This updates the same record \u2014 it does not create a second registration, and the token stays as it was given to the household head.</div>`:''}
      ${visibleQs(form).map(qCard).join('')}
      ${editing?'':gpsCard()}
    </div></div>
    <div class="footer">${editing
      ? `<button class="btn btn-ghost btn-sm" onclick="editing=false;renderSaved()">Cancel</button>
         <button class="btn btn-ok" onclick="submitHH()">Save changes</button>`
      : `<button class="btn btn-ok btn-block" onclick="submitHH()">Register household ${h}</button>`}</div>`;
  wireForm();
}
function wireForm(){
  const b=document.getElementById('fb'); if(!b) return;
  b.addEventListener('click',e=>{
    const o=e.target.closest('.opt'); if(!o) return;
    form[o.dataset.q]=o.dataset.v;
    if(o.dataset.q==='hasPhone'){ delete form.hasAlt; delete form.phone; delete form.altPhone; }
    if(o.dataset.q==='hasAlt'){ delete form.altPhone; }
    if(o.dataset.q==='hasNid'&&o.dataset.v==='No') delete form.nid;
    if(o.dataset.q==='hasDl'&&o.dataset.v==='No') delete form.dl;
    if(o.dataset.q==='hasVid'&&o.dataset.v==='No') delete form.vid;
    renderForm();
    const c=document.getElementById('qc_'+o.dataset.q); if(c) c.scrollIntoView({behavior:'smooth',block:'center'});
  });
  b.addEventListener('input',e=>{
    const i=e.target.closest('[data-k]'); if(!i) return;
    const k=i.dataset.k;
    const qq=FORM.find(x=>x.id===k);
    if(qq&&qq.type==='tel'){                     /* digits only, never more than 9 */
      const clean=digits(i.value).slice(0,PHONE_LEN);
      if(i.value!==clean){ const at=i.selectionStart; i.value=clean;
        try{ i.setSelectionRange(Math.min(at,clean.length),Math.min(at,clean.length)); }catch(_){} }
    }
    form[k]=i.value;
    const card=document.getElementById('qc_'+k);
    if(card){ card.classList.remove('missing'); const er=card.querySelector('.err'); if(er) er.remove(); }
    if(k==='first'||k==='last'){ refreshToken(); paint('token',form._token); }
    if(k==='size'){ paint('itns',itnsFor(form.size)); }
  });
}
function paint(id,val){
  const c=document.getElementById('qc_'+id); if(!c) return;
  const i=c.querySelector('input'); if(i) i.value=(val===''||val==null)?'\u2014':val;
}

/* ---------- submit: token, then GPS ---------- */
function submitHH(){
  refreshToken();
  const qs=visibleQs(form), bad=qs.filter(q=>fieldErr(q,form));
  if(bad.length){
    showErr=true; renderForm();
    const f=document.getElementById('qc_'+bad[0].id);
    if(f) f.scrollIntoView({behavior:'smooth',block:'center'});
    toast(bad.length+' question'+(bad.length===1?'':'s')+' to fix');
    return;
  }
  showErr=false;
  if(editing){ saveEdit(); return; }
  if(!(gpsState==='ok'&&gpsFix)){
    if(gpsState==='idle'){ gpsMissing=true; paintGps(); }
    const g=document.getElementById('qc_gps'); if(g) g.scrollIntoView({behavior:'smooth',block:'center'});
    toast(gpsState==='getting'?'Wait for the GPS to be captured':'Press Capture GPS first');
    return;
  }
  /* nobody home: no names, no token — just the point and a revisit flag */
  if(form.adults==='No'){ gpsStep(finishRevisit); return; }
  tokenStep(false);
}
/* An edit keeps the record's _id, token and GPS point, bumps its revision and
   marks it for resending. The server updates that row rather than adding one. */
function saveEdit(){
  const d=formD,h=formH,old=recGet(d,h)||{};
  const rec=Object.assign({},old,form,{
    itns:itnsFor(form.size),
    token:old.token||form._token,
    _rev:(old._rev||1)+1,
    _dirty:true,
    _updatedAt:new Date().toISOString()
  });
  delete rec._token;
  recSet(d,h,rec);
  editing=false;
  const was=!!old._submitted;
  modal(`<h3>Changes saved</h3>
    <div class="tok-show">${esc(rec.token)}</div>
    <p style="margin-top:12px">${esc(rec.first+' '+rec.last)} \u00b7 ${rec.size} people \u00b7 ${rec.itns} ITN${rec.itns===1?'':'s'} \u00b7 ${rec.u5} under-five${Number(rec.u5)===1?'':'s'} \u00b7 ${rec.preg} pregnant<br>Revision ${rec._rev} \u00b7 same record, same token.</p>
    ${was?`<div class="sync-bar warn" style="margin:0"><span class="d"></span>
        <div class="t">This record was already submitted. Resubmit it so the corrected values are sent.</div></div>`
        :`<div class="gps-ok">It will go up with the rest of Day ${d}.</div>`}
    <div class="acts">
      <button class="btn btn-ghost" onclick="closeModal();renderSaved()">Close</button>
      ${dayComplete(d)?`<button class="btn btn-primary" onclick="closeModal();submitDay(${d})">Resubmit now</button>`
                      :`<button class="btn btn-ok" onclick="closeModal();renderDay(${d})">Day ${d}</button>`}
    </div>`);
}
function closeModal(){ document.getElementById('modal').innerHTML=''; }
function modal(html){ document.getElementById('modal').innerHTML=`<div class="ovl"><div class="sheet">${html}</div></div>`; }

/* Step 1 — show the token and have the HHR write it down for the household. */
function tokenStep(again){
  modal(`<h3>${again?'Please write the token down':'Write this token down'}</h3>
    <p>${again
      ? 'The household head must be given the token on paper before this household can be submitted. Write it down and hand it over now.'
      : 'HHR: write this token on paper and give it to the household head.'}</p>
    <div class="tok-show">${esc(form._token)}</div>
    ${again?`<div class="err" style="margin-top:10px">Not submitted yet.</div>`:''}
    <p style="margin:14px 0 0">Have you written down the token and given it to the household head?</p>
    <div class="acts">
      <button class="btn btn-ghost" onclick="tokenStep(true)">No, not yet</button>
      <button class="btn btn-ok" onclick="gpsStep()">Yes, it is written</button>
    </div>`);
}
/* Step 2 — the GPS point. Usually already in hand, so this passes straight
   through; otherwise it waits for the fix that is already being taken. */
function gpsStep(next){
  gpsNext = (typeof next==='function') ? next : finish;
  if(gpsState==='ok'&&gpsFix){ gpsNext(gpsFix); return; }
  /* a fix that failed earlier in the interview gets one fresh attempt now —
     the registrar may well have moved outside since */
  if(gpsState!=='getting') beginGps();
  modal(`<h3>Waiting for the GPS point</h3><div class="spin"></div>
    <p style="text-align:center" id="gpsWait">Everything else is ready. Step into the open if you can \u2014 the household is saved the moment a point comes in.</p>`);
  const t0=Date.now();
  const tick=()=>{
    if(gpsState==='ok'&&gpsFix){ gpsNext(gpsFix); return; }
    if(gpsState==='fail'){ gpsFail(gpsErr||'GPS could not get a fix.'); return; }
    if(Date.now()-t0>30000){ gpsFail('GPS is taking too long.'); return; }
    setTimeout(tick,250);
  };
  setTimeout(tick,150);
}
/* A GPS point is required. Without one the household is not registered — the
   only ways out are to try again or to leave the form open and come back. */
function gpsFail(msg){
  modal(`<h3>No GPS point yet</h3>
    <p>${esc(msg)} Step outside or into the open and try again. The household cannot be registered without its GPS point.</p>
    <div class="err">Household ${formH} is not registered.</div>
    <div class="acts">
      <button class="btn btn-ghost" onclick="closeModal();paintGps()">Not now</button>
      <button class="btn btn-primary" onclick="beginGps();gpsStep(gpsNext)">Try again</button>
    </div>`);
}
function finish(gps){
  const d=formD,h=formH;
  const was=recGet(d,h)||{};          /* a revisit being completed keeps its first point */
  const rec=Object.assign({},form,{
    _status:'Registered',
    revisitLat:was.revisitLat||'', revisitLng:was.revisitLng||'',
    revisitAcc:was.revisitAcc||'', revisitAt:was.revisitAt||'',
    _wasRevisit:isRevisit(was)?'Yes':'',
    _id:me+'-D'+d+'-H'+h,          /* stable — a resubmission updates this row */
    _hhr:me, _day:d, _hh:h, _serial:hhSerial(d,h),
    _district:(hhrPlace(me)||{}).district||'', _chiefdom:(hhrPlace(me)||{}).chiefdom||'',
    _phu:(hhrPlace(me)||{}).phu||'', _phuCode:(hhrPlace(me)||{}).phuCode||'',
    token:form._token, itns:itnsFor(form.size),
    gpsLat:gps.lat, gpsLng:gps.lng, gpsAcc:gps.acc, gpsAt:gps.at,
    _rev:(was._rev||0)+1, _submitted:false, _dirty:false, _submittedAt:'',
    _ts:was._ts||new Date().toISOString(), _registeredAt:new Date().toISOString()
  });
  delete rec._token;
  recSet(d,h,rec);
  setDone(d,h,true);
  gpsStop(); gpsFix=null; gpsState='idle';
  closeModal();
  savedModal(rec,'sending');
  /* each household goes up on its own, as soon as it is registered */
  if(!GAS_URL||!navigator.onLine){ savedModal(rec,'queued'); return; }
  sendRec(rec,(ok,status)=>{
    if(ok){ rec._submitted=true; rec._dirty=false; rec._submittedAt=new Date().toISOString(); }
    else rec._lastError=status||'failed';
    saveRecs();
    savedModal(rec,ok?'sent':'failed');
  });
}
/* Nobody was home. The point is taken so the household can be found again, and
   the card turns yellow until someone comes back to it. */
function finishRevisit(gps){
  const d=formD,h=formH;
  const rec={
    _id:me+'-D'+d+'-H'+h, _hhr:me, _day:d, _hh:h, _serial:hhSerial(d,h),
    _district:(hhrPlace(me)||{}).district||'', _chiefdom:(hhrPlace(me)||{}).chiefdom||'',
    _phu:(hhrPlace(me)||{}).phu||'', _phuCode:(hhrPlace(me)||{}).phuCode||'',
    _status:'Revisit', adults:'No', token:'',
    revisitLat:gps.lat, revisitLng:gps.lng, revisitAcc:gps.acc, revisitAt:gps.at,
    gpsLat:'', gpsLng:'', gpsAcc:'', gpsAt:'',
    _rev:1, _submitted:false, _dirty:false, _submittedAt:'',
    _ts:new Date().toISOString()
  };
  recSet(d,h,rec);
  setDone(d,h,true);
  gpsStop(); gpsFix=null; gpsState='idle';
  closeModal();
  revisitModal(rec,'sending');
  if(!GAS_URL||!navigator.onLine){ revisitModal(rec,'queued'); return; }
  sendRec(rec,(ok,status)=>{
    if(ok){ rec._submitted=true; rec._dirty=false; rec._submittedAt=new Date().toISOString(); }
    else rec._lastError=status||'failed';
    saveRecs();
    revisitModal(rec,ok?'sent':'queued');
  });
}
function revisitModal(rec,state){
  const d=rec._day,h=rec._hh;
  const line =
    state==='sending' ? `<div class="sync-bar wait" style="margin:13px 0 0"><span class="d"></span><div class="t">Submitting\u2026</div></div>`
  : state==='sent'   ? `<div class="gps-ok" style="margin-top:13px">Submitted.</div>`
  :                    `<div class="sync-bar warn" style="margin:13px 0 0"><span class="d"></span>
        <div class="t"><b>Saved on this device.</b><br>It is submitted on its own as soon as there is internet.</div></div>`;
  modal(`<h3>Household ${h} marked for revisit</h3>
    <p>Nobody was available. The GPS point is saved so you can find the household again, and the card stays <b>yellow</b> until it is registered.</p>
    <div class="gps-ok">Point \u00b7 ${rec.revisitLat}, ${rec.revisitLng} (\u00b1${rec.revisitAcc} m)</div>
    ${line}
    <div class="acts">
      ${state==='sending'?'':`<button class="btn btn-ok btn-block" onclick="closeModal();renderDay(${d})">Back to Day ${d}</button>`}
    </div>`);
}

/* The household that was just registered. There is deliberately no shortcut to
   the next one: the registrar goes back to the day and opens the next card. */
function savedModal(rec,state){
  const d=rec._day,h=rec._hh;
  const full=dayComplete(d);
  const line =
    state==='sending' ? `<div class="sync-bar wait" style="margin:13px 0 0"><span class="d"></span>
        <div class="t">Submitting this household\u2026</div></div>`
  : state==='sent'    ? `<div class="gps-ok" style="margin-top:13px">Submitted.</div>`
  : state==='queued'  ? `<div class="sync-bar warn" style="margin:13px 0 0"><span class="d"></span>
        <div class="t"><b>Saved on this device.</b><br>${GAS_URL?'No internet \u2014 submit it from the household or with the day.':'The server is not connected.'}</div></div>`
  :                     `<div class="sync-bar warn" style="margin:13px 0 0"><span class="d"></span>
        <div class="t"><b>Saved, but it was not submitted.</b><br>Open the household and submit it again.</div></div>`;
  modal(`<h3>Household ${h} registered</h3>
    <div class="tok-show">${esc(rec.token)}</div>
    <p style="margin-top:12px">${esc(rec.first+' '+rec.last)} \u00b7 ${rec.size} people \u00b7 ${rec.itns} ITN${rec.itns===1?'':'s'} \u00b7 ${rec.u5} under-five${Number(rec.u5)===1?'':'s'} \u00b7 ${rec.preg} pregnant</p>
    <div class="gps-ok">GPS \u00b7 ${rec.gpsLat}, ${rec.gpsLng} (\u00b1${rec.gpsAcc} m)</div>
    ${line}
    ${full?`<div class="sync-bar warn" style="margin:13px 0 0"><span class="d"></span>
        <div class="t"><b>Day ${d} is finished.</b>${dayToSend(d).length?' '+dayToSend(d).length+' record'+(dayToSend(d).length===1?'':'s')+' still to submit.':' Everything is submitted.'}</div></div>`:''}
    <div class="acts">
      ${state==='sending'?'':`<button class="btn btn-${full&&dayToSend(d).length?'ghost':'ok'} btn-block" onclick="closeModal();renderDay(${d})">Back to Day ${d}</button>`}
      ${state!=='sending'&&full&&dayToSend(d).length?`<button class="btn btn-primary" onclick="closeModal();submitDay(${d})">Submit the rest of Day ${d}</button>`:''}
    </div>`);
}

/* ---------- a household already registered ---------- */
function renderSaved(){
  const d=formD,h=formH,r=recGet(d,h)||{};
  const row=(k,v)=>`<div class="rv-item"><span class="q">${esc(k)}</span><span class="a">${esc(v===''||v==null?'\u2014':v)}</span></div>`;
  const contact = r.hasPhone==='Yes' ? r.phone+' (household head)'
    : r.hasAlt==='Yes' ? r.altPhone+' (someone else)'
    : r.hhrPhone ? r.hhrPhone+' (HHR)' : 'No number given';
  app.innerHTML=`<div class="appbar">
      <button class="ico-btn" onclick="renderDay(${d})">${I.back}</button>
      <div class="titles"><div class="eyebrow">${esc(me)} \u00b7 Day ${d}</div><div class="title">Household ${h} \u00b7 registered</div></div>
      <span class="tag-pill me">${hhSerial(d,h)}/${DAYS*PER_DAY}</span>
    </div>
    <div class="body"><div class="list">
      <div class="hd-head"><div class="id">${esc(r.token||'')}</div>
        <div class="meta">${esc((r.first||'')+' '+(r.last||''))}<br>Registered ${esc(String(r._ts||'').slice(0,16).replace('T',' '))}</div></div>
      ${r._submitted&&!r._dirty
        ? `<div class="sync-bar ok"><span class="d"></span><div class="t"><b>Submitted.</b>${r._rev>1?' Revision '+r._rev+'.':''}</div></div>`
        : r._submitted&&r._dirty
        ? `<div class="sync-bar warn"><span class="d"></span><div class="t"><b>Changed since it was submitted.</b><br>Resubmit Day ${d} to send revision ${r._rev}.</div>
             <button class="btn btn-primary btn-sm" style="flex:0 0 auto" onclick="submitDay(${d})">Resubmit</button></div>`
        : `<div class="sync-bar wait"><span class="d"></span><div class="t"><b>Registered, not yet submitted.</b><br>${dayComplete(d)?'Day '+d+' is finished — submit its records.':'It goes up when all '+PER_DAY+' households of Day '+d+' are done.'}</div></div>`}
      <div class="flag ok">Registered.${h<PER_DAY?' Household '+(h+1)+' is open.':' Day '+d+' is complete.'}</div>
      <div class="card" style="padding-top:6px">
        ${row('Household head',(r.first||'')+' '+(r.last||''))}
        ${row('Contact number',contact)}
        ${row('People in household',r.size)}
        ${row('ITNs to be given',r.itns)}
        ${row('Under-fives',r.u5)}
        ${row('Pregnant women',r.preg)}
        ${row('National ID',r.hasNid==='Yes'?r.nid:'No')}
        ${row('Driver\u2019s licence',r.hasDl==='Yes'?r.dl:'No')}
        ${row('Voter\u2019s ID',r.hasVid==='Yes'?r.vid:'No')}
        ${row('Token',r.token)}
        ${row('GPS',r.gpsLat?r.gpsLat+', '+r.gpsLng+' (\u00b1'+r.gpsAcc+' m)':'not recorded')}
        ${row('Revision',r._rev||1)}
      </div>
    </div></div>
    <div class="footer">
      <button class="btn btn-ghost btn-sm" onclick="editHH()">Edit</button>
      ${needsSend(r)
        ? `<button class="btn btn-ok" onclick="submitOne(${d},${h})">${r._submitted?'Resubmit this record':'Submit this record'}</button>`
        : `<button class="btn btn-primary" onclick="renderDay(${d})">Back to Day ${d}</button>`}
    </div>`;
}
/* One record on its own — for when a household fails in the day batch, or an
   edit needs to be submitted without waiting for the rest of the day. */
function submitOne(d,h){
  if(!GAS_URL){ setGAS(); return; }
  const rec=recGet(d,h);
  if(!rec){ toast('Nothing to submit'); return; }
  if(!needsSend(rec)){ toast('Household '+h+' is already submitted'); return; }
  if(!navigator.onLine){ modal(`<h3>No internet</h3>
    <p>Household ${h} is safe on this device. Connect and submit again.</p>
    <div class="acts"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>`); return; }
  modal(`<h3>Submitting household ${h}</h3><div class="spin"></div>
    <p style="text-align:center">${esc(rec.token||'')}</p>`);
  sendRec(rec,(ok,status)=>{
    if(ok){ rec._submitted=true; rec._dirty=false; rec._submittedAt=new Date().toISOString(); }
    else rec._lastError=status||'failed';
    saveRecs();
    const left=dayToSend(d).length;
    modal(`<h3>${ok?'Household '+h+' submitted':'Could not submit household '+h}</h3>
      <div class="tok-show">${esc(rec.token||'')}</div>
      ${ok?`<div class="gps-ok" style="margin-top:12px">Submitted${rec._rev>1?' as revision '+rec._rev:''}.${left?' '+left+' other record'+(left===1?'':'s')+' still to send for Day '+d+'.':''}</div>`
          :`<div class="err" style="margin-top:12px">${esc(status==='network'||status==='timeout'?'The connection failed. It stays on this device \u2014 try again.':'The server refused it ('+(status||'error')+').')}</div>`}
      <div class="acts">
        <button class="btn btn-ghost" onclick="closeModal();renderSaved()">Close</button>
        ${ok?(left?`<button class="btn btn-primary" onclick="closeModal();submitDay(${d})">Send the other ${left}</button>`
                  :`<button class="btn btn-ok" onclick="closeModal();renderDay(${d})">Day ${d}</button>`)
            :`<button class="btn btn-primary" onclick="closeModal();submitOne(${d},${h})">Try again</button>`}
      </div>`);
  });
}

/* ---------- start ---------- */
if(me&&credsFor(me)){
  loadDone(); renderMenu(); autoSync();
} else { me=null; renderDistricts(); }
</script>
